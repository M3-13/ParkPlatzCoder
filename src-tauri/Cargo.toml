[package]
name = "parkplatzcoder"
version = "0.1.0"
description = "ParkPlatzCoder — lokales Tauri-Tray-Tool zum schnellen Parken von Freitext-Notizen mit Git-Kontext"
authors = ["ParkPlatzCoder"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "parkplatzcoder"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tauri = "2"
